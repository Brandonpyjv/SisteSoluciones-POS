<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Methods | Siste Soluciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="text-center mb-4">
        <h1><i class="fas fa-credit-card"></i> Payment Methods</h1>
    </div>

    <div class="text-end mb-3">
        <a href="/payment_methods/new" class="btn btn-success">
            <i class="fas fa-plus-circle"></i> New Payment Method
        </a>
    </div>

    <div class="card">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for method in all_payment_methods %}
                    <tr>
                        <td>{{ method.cod_pago }}</td>
                        <td>{{ method.descripcion}}</td>

                        <td class="text-center">
                            <a href="/payment_methods/edit/{{ method.method_id }}"
                               class="btn btn-primary btn-sm">
                                <i class="fas fa-edit"></i> Edit
                            </a>

                            <a href="/payment_methods/delete/{{ method.method_id }}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this payment method?')">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    {% endfor %}

                    {% if not all_payment_methods %}
                    <tr>
                        <td colspan="3" class="text-center text-muted">
                            No payment methods registered.
                        </td>
                    </tr>
                    {% endif %}
                </tbody>
            </table>

        </div>
    </div>

</div>

<div class="container text-center my-4">
    <a href="/" class="btn btn-secondary px-4 py-2">
        Back to Home
    </a>
</div>

</body>
</html>
