<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-warning">
    <div class="container">
        <a class="navbar-brand" th:href="@{/logs}">
            <i class="fas fa-arrow-left"></i> Volver a Logs
        </a>
        <span class="navbar-brand" th:text="${log.idLog != null} ? 'Editar Log' : 'Nuevo Log'"></span>
    </div>
</nav>

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card">
                <div class="card-header">
                    <h4 th:text="${log.idLog != null} ? 'Editar Log' : 'Nuevo Log'"></h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/logs/guardar}" th:object="${log}" method="post">

                        <input type="hidden" th:field="*{idLog}">

                        <!-- USUARIO -->
                        <div class="mb-3">
                            <label class="form-label">Usuario *</label>
                            <select th:field="*{usuario}" class="form-control" required>
                                <option th:each="u : ${usuarios}"
                                        th:value="${u.id}"
                                        th:text="${u.nombre}">
                                </option>
                            </select>
                        </div>

                        <!-- ACCION -->
                        <div class="mb-3">
                            <label class="form-label">Acción *</label>
                            <input type="text" th:field="*{accion}" class="form-control" required>
                        </div>

                        <!-- DESCRIPCIÓN -->
                        <div class="mb-3">
                            <label class="form-label">Descripción *</label>
                            <textarea th:field="*{descripcion}" class="form-control"></textarea>
                        </div>

                        <!-- FECHA -->
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="datetime-local" th:field="*{fecha}" class="form-control">
                        </div>

                        <!-- BOTONES -->
                        <button type="submit" class="btn btn-warning">Guardar</button>
                        <a th:href="@{/logs}" class="btn btn-secondary">Cancelar</a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
