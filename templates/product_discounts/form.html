<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - Descuento</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	
<div class="container mt-5">
    <h2 class="mb-4">Nuevo Registro Producto - Descuento</h2>

    <form th:action="@{/productos_descuentos/guardar}" method="post" th:object="${productosDescuentos}">
        <div class="mb-3">
            <label for="codProducto" class="form-label">Código de Producto:</label>
            <input type="number" id="codProducto" th:field="*{id.cod_producto}" class="form-control" required step="1">
        </div>

        <div class="mb-3">
            <label for="codDescuento" class="form-label">Código de Descuento:</label>
            <input type="number" id="codDescuento" th:field="*{id.cod_descuento}" class="form-control" required step="1">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('product_discounts') }}" class="btn btn-secondary">Volver a la lista</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
