<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${configuracion.clave != null} ? 'Editar Configuración' : 'Nueva Configuración'">Formulario Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
 

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 th:text="${configuracion.clave != null} ? 'Editar Configuración' : 'Nueva Configuración'"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/configuracion/guardar}" th:object="${configuracion}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Clave *</label>
                                <input type="text" th:field="*{clave}" class="form-control" required 
                                       th:readonly="${configuracion.clave != null}">
                                <div class="form-text">Identificador único de la configuración</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Valor *</label>
                                <textarea th:field="*{valor}" class="form-control" rows="4" required></textarea>
                                <div class="form-text">Valor de la configuración</div>
                            </div>
                            
                            <!-- Ejemplos de configuraciones comunes -->
                            <div class="mb-3">
                                <label class="form-label">Configuraciones Predefinidas:</label>
                                <select class="form-select" onchange="cargarConfiguracion(this.value)">
                                    <option value="">Seleccionar configuración común...</option>
                                    <option value='{"clave":"empresa.nombre","valor":"Mi Empresa"}'>Nombre de Empresa</option>
                                    <option value='{"clave":"empresa.telefono","valor":"+58 412-1234567"}'>Teléfono Empresa</option>
                                    <option value='{"clave":"sistema.iva","valor":"16"}'>Porcentaje de IVA</option>
                                    <option value='{"clave":"sistema.moneda","valor":"Bs"}'>Moneda</option>
                                    <option value='{"clave":"email.smtp","valor":"smtp.miempresa.com"}'>Servidor SMTP</option>
                                </select>
                            </div>
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-secondary">
                                    <i class="fas fa-save"></i> 
                                    <span th:text="${configuracion.clave != null} ? 'Actualizar' : 'Guardar'"></span>
                                </button>
                                <a href="{{ url_for('setting') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function cargarConfiguracion(configJson) {
            if (configJson) {
                const config = JSON.parse(configJson);
                document.querySelector('input[name="clave"]').value = config.clave;
                document.querySelector('textarea[name="valor"]').value = config.valor;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
